name: Android CI

# Three jobs:
#   check   — unit tests + lint. Runs on everything, including pull requests. Gates the build.
#   build   — matrix job: builds ONE flavor's signed APK per runner (standard, x86_64). Splitting
#             the flavors across two runners halves peak memory per job vs. the old single-job
#             `assembleRelease`, which ran both flavors' Kotlin compiles + R8 minifies back to back
#             and could OOM the runner (symptom: "runner lost communication with the server").
#   package — downloads both flavor APKs, names/copies them into dist/, and publishes the
#             GitHub Release on tag builds. This is the job that used to live at the tail end of
#             the old single `build` job.
on:
  push:
    branches: [ main ]
    tags: [ "v*" ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write   # required so tag builds can create a Release

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Nothing was checking the unit tests or lint before, so both could rot silently while the APK
  # kept building. This job is the gate: if it is red, no APK is produced and no release is cut.
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: |
          chmod +x ./gradlew
          ./gradlew testStandardDebugUnitTest --stacktrace

      - name: Lint
        if: always()
        run: ./gradlew lintStandardDebug --stacktrace

      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: check-reports
          path: |
            app/build/reports/tests/**
            app/build/reports/lint-results-*.html
            app/build/reports/lint-results-*.txt
          if-no-files-found: warn

  build:
    needs: check
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    # Was hanging silently for ~59min before GitHub killed it. Fail fast instead so a stuck build
    # shows up as a clear timeout, not a mystery yellow run.
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          # `flavor` matches the AGP output folder (app/build/outputs/apk/<flavor>/...).
          # `task` is the capitalized form Gradle task names use (assemble<task>Release).
          - flavor: standard
            task: Standard
          - flavor: x86_64
            task: X86_64
    env:
      IS_TAG: ${{ startsWith(github.ref, 'refs/tags/v') }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Compute version (from the git tag on releases)
        id: ver
        run: |
          if [ "$IS_TAG" = "true" ]; then
            NAME="${GITHUB_REF_NAME#v}"
            IFS='.' read -r MA MI PA <<< "$NAME"
            CODE=$(( ${MA:-0} * 10000 + ${MI:-0} * 100 + ${PA:-0} ))
            [ "$CODE" -gt 0 ] || CODE=1
          else
            NAME="99.99.99"
            CODE=99999
          fi
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "Version: $NAME (code $CODE)"

      - name: Decode signing keystore (if configured)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
            echo "Release signing configured."
          else
            echo "No KEYSTORE_BASE64 secret set — building a debug-signed APK."
          fi

      - name: Derive the release edge key
        env:
          OWNTV_EDGE_MASTER: ${{ secrets.OWNTV_EDGE_MASTER }}
          OWNTV_EDGE_KEY: ${{ secrets.OWNTV_EDGE_KEY }}
          VERSION_NAME: ${{ steps.ver.outputs.name }}
        run: |
          if [ -n "$OWNTV_EDGE_MASTER" ]; then
            KEY=$(printf '%s' "$VERSION_NAME" \
              | openssl dgst -sha256 -hmac "$OWNTV_EDGE_MASTER" -hex \
              | awk '{print $NF}')
            echo "::add-mask::$KEY"
            echo "OWNTV_EDGE_KEY=$KEY" >> "$GITHUB_ENV"
            echo "Derived the edge key for $VERSION_NAME."
          elif [ -n "$OWNTV_EDGE_KEY" ]; then
            echo "::add-mask::$OWNTV_EDGE_KEY"
            echo "OWNTV_EDGE_KEY=$OWNTV_EDGE_KEY" >> "$GITHUB_ENV"
            echo "No OWNTV_EDGE_MASTER — using the static edge key."
          else
            echo "No edge secret configured (fork build) — the app will use the unprotected base URL."
          fi

      # Diagnostics: if a build ever stalls/OOMs again, these numbers in the log tell us whether it
      # was a memory ceiling (compare against the jvmargs below) or something else (network, CPU).
      - name: Show runner resources
        run: |
          echo "--- CPU ---"; nproc
          echo "--- Memory ---"; free -h
          echo "--- Disk ---"; df -h .

      # ~/.gradle/gradle.properties (GRADLE_USER_HOME) takes precedence over the project's
      # ./gradle.properties, so this overrides the repo's heap settings for CI only — no need to
      # touch the committed file, which is intentionally sized for a full local 8-variant build.
      # Since each matrix job now builds only ONE flavor (one Kotlin compile + one R8 minify, not
      # two back to back), these lower values comfortably fit a standard hosted runner.
      - name: Configure CI JVM memory
        run: |
          mkdir -p ~/.gradle
          cat >> ~/.gradle/gradle.properties << 'EOF'
          org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8
          kotlin.daemon.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
          org.gradle.workers.max=2
          EOF
          cat ~/.gradle/gradle.properties

      - name: Build APK (${{ matrix.flavor }})
        env:
          VERSION_NAME: ${{ steps.ver.outputs.name }}
          VERSION_CODE: ${{ steps.ver.outputs.code }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x ./gradlew
          if [ -n "$KEYSTORE_FILE" ]; then
            echo "Building signed release APK (${{ matrix.flavor }})"
            ./gradlew assemble${{ matrix.task }}Release --stacktrace
            SRC=$(ls app/build/outputs/apk/${{ matrix.flavor }}/release/*.apk | head -n1)
          else
            echo "Building debug APK (${{ matrix.flavor }})"
            ./gradlew assemble${{ matrix.task }}Debug --stacktrace
            SRC=$(ls app/build/outputs/apk/${{ matrix.flavor }}/debug/*.apk | head -n1)
          fi
          echo "Built: $SRC"
          echo "SRC=$SRC" >> "$GITHUB_ENV"

      - name: Upload raw APK
        uses: actions/upload-artifact@v4
        with:
          name: apk-${{ matrix.flavor }}
          path: ${{ env.SRC }}
          if-no-files-found: error

  package:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    env:
      IS_TAG: ${{ startsWith(github.ref, 'refs/tags/v') }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compute version (from the git tag on releases)
        id: ver
        run: |
          if [ "$IS_TAG" = "true" ]; then
            NAME="${GITHUB_REF_NAME#v}"
            IFS='.' read -r MA MI PA <<< "$NAME"
            CODE=$(( ${MA:-0} * 10000 + ${MI:-0} * 100 + ${PA:-0} ))
            [ "$CODE" -gt 0 ] || CODE=1
          else
            NAME="99.99.99"
            CODE=99999
          fi
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"

      - name: Download standard APK
        uses: actions/download-artifact@v4
        with:
          name: apk-standard
          path: raw/standard

      - name: Download x86_64 APK
        uses: actions/download-artifact@v4
        with:
          name: apk-x86_64
          path: raw/x86_64

      - name: Name the APKs (OwnTV-v<version>)
        run: |
          mkdir -p dist
          ARM_SRC=$(ls raw/standard/*.apk | head -n1)
          X86_SRC=$(ls raw/x86_64/*.apk | head -n1)

          if [ "$IS_TAG" = "true" ]; then
            OUT="OwnTV-v${{ steps.ver.outputs.name }}.apk"
          else
            OUT="OwnTV-dev-${GITHUB_SHA::7}.apk"
          fi
          cp "$ARM_SRC" "dist/$OUT"
          echo "APK_OUT=$OUT" >> "$GITHUB_ENV"
          echo "Packaged dist/$OUT (arm: arm64-v8a + armeabi-v7a)"

          if [ "$IS_TAG" = "true" ]; then
            cp "$ARM_SRC" "dist/OwnTV.apk"
            cp "$X86_SRC" "dist/OwnTV-x86_64-v${{ steps.ver.outputs.name }}.apk"
            echo "Packaged dist/OwnTV-x86_64-v${{ steps.ver.outputs.name }}.apk"
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APK_OUT }}
          path: dist/*
          if-no-files-found: error

      - name: Extract release notes from CHANGELOG_APP.md
        if: env.IS_TAG == 'true'
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if [ -f CHANGELOG_APP.md ]; then
            awk -v ver="$TAG" '
              $0 ~ ("^## " ver "([ \t]|$)") { flag=1; next }
              /^## v/ && flag { flag=0 }
              flag { print }
            ' CHANGELOG_APP.md > dist/RELEASE_NOTES.md || true
            sed -i -e '/./,$!d' dist/RELEASE_NOTES.md
            awk 'NF{p=NR} {a[NR]=$0} END{for(i=1;i<=p;i++) print a[i]}' \
              dist/RELEASE_NOTES.md > dist/RELEASE_NOTES.trimmed.md
            mv dist/RELEASE_NOTES.trimmed.md dist/RELEASE_NOTES.md
          fi
          if [ ! -s dist/RELEASE_NOTES.md ]; then
            echo "::warning::No CHANGELOG_APP.md section for $TAG — publishing a placeholder body."
            echo "See [CHANGELOG.md](https://github.com/$GITHUB_REPOSITORY/blob/$TAG/CHANGELOG.md) for details." \
              > dist/RELEASE_NOTES.md
          fi
          echo "--- Release notes ---"
          cat dist/RELEASE_NOTES.md

      - name: Publish GitHub Release
        if: env.IS_TAG == 'true'
        uses: softprops/action-gh-release@v2
        with:
          name: OwnTV ${{ github.ref_name }}
          files: |
            dist/${{ env.APK_OUT }}
            dist/OwnTV.apk
            dist/OwnTV-x86_64-v${{ steps.ver.outputs.name }}.apk
          body_path: dist/RELEASE_NOTES.md
          generate_release_notes: false
